<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Скачать «1С-Рарус: Мероприятие»</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
      color: #18252d; background: #eff3f4; font: 17px/1.5 system-ui, sans-serif; }
    main { width: min(100%, 29rem); padding: clamp(24px, 6vw, 44px);
      border: 1px solid #d5dee1; border-radius: 24px; background: white; }
    h1 { margin: 0 0 24px; font-size: clamp(28px, 6vw, 40px); line-height: 1.08;
      letter-spacing: -.04em; overflow-wrap: anywhere; }
    p { margin: 0; color: #495d65; }
    a { color: #124f59; text-decoration: none; }
    a:focus-visible { outline: 3px solid #147581; outline-offset: 3px; }
    .store { display: none; padding: 14px 0; border-bottom: 1px solid #d5dee1;
      font-weight: 650; align-items: center; gap: 12px; }
    .store[href]:not([href=""]) { display: flex; }
    .store span { flex: 1; }
    .store small { color: #495d65; font-weight: 450; }
    .store:hover span { text-decoration: underline; }
    .store[href]:not([href=""]) ~ .empty { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>1С-Рарус: Мероприятие</h1>
    <!-- Добавьте атрибут href только у доступных магазинов. -->
    <div id="stores" data-android-default="google-play">
      <a class="store" id="app-store" href="https://apps.apple.com/az/app/1%D1%81-%D1%80%D0%B0%D1%80%D1%83%D1%81-%D0%BC%D0%B5%D1%80%D0%BE%D0%BF%D1%80%D0%B8%D1%8F%D1%82%D0%B8%D0%B5/id1444723437?yqrid=37126420"><span>App Store</span><small>iOS</small><b aria-hidden="true">↗</b></a>
      <a class="store" id="google-play" href="https://play.google.com/store/apps/details?id=com.rarus.events&amp;hl=ru&amp;yqrid=7d84a2dd"><span>Google Play</span><small>Android</small><b aria-hidden="true">↗</b></a>
      <a class="store" id="rustore"><span>RuStore</span><small>Android</small><b aria-hidden="true">↗</b></a>
      <p class="empty">Ссылки для скачивания пока недоступны.</p>
    </div>
  </main>
  <script>
    (() => {
      const stores = document.getElementById('stores');
      const links = new Map();
      for (const anchor of stores.querySelectorAll('a[href]')) {
        if (anchor.protocol === 'https:' && anchor.getAttribute('href').startsWith('https://')) {
          links.set(anchor.id, anchor.href);
        } else {
          anchor.removeAttribute('href');
        }
      }
      if (new URLSearchParams(location.search).has('choose')) return;
      const ua = navigator.userAgent;
      let target;
      if (/Windows Phone|IEMobile/i.test(ua)) return;
      if (/Android/i.test(ua)) {
        const priority = stores.dataset.androidDefault === 'rustore'
          ? ['rustore', 'google-play'] : ['google-play', 'rustore'];
        target = links.get(priority[0]) || links.get(priority[1]);
      } else if (/iPhone|iPad|iPod/i.test(ua) ||
                 (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
        target = links.get('app-store');
      }
      if (target) location.replace(target);
    })();
  </script>
</body>
</html>
